[project]
name = "reference-extraction-service"
version = "1.0.0"
description = "Dedicated pre-chunk document reference extraction worker (Neo4j)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.9",
    "pydantic>=2.8.0",
    "neo4j>=5.28.0",
]

[project.scripts]
reference-extraction-service = "src.workers.reference_processor.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["src.application*", "src.features*", "src.infrastructure*", "src.workers*", "src.shared*"]
