[project]
name = "dms-service"
version = "1.0.0"
description = "DMS Platform Engine composite HTTP service (Consumer API + domain packages)"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pika>=1.3.0",
    "requests>=2.28.0",
    "weaviate-client>=4.8.0",
    "psycopg2-binary>=2.9.9",
    "transformers>=4.42.0",
    "torch>=2.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "pymongo>=4.6.0",
    "imageio-ffmpeg>=0.4.9",
    "faster-whisper>=1.0.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "langdetect>=1.0.9",
    "deep-translator>=1.11.4",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
retrieval = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]
preview = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "mammoth>=1.8.0",
    "redis>=5.0.0",
]
neo4j = [
    "neo4j>=5.0.0",
]
observability = [
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.scripts]
dms-service = "src.application.consumer_api.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["src.application*", "src.features*", "src.infrastructure*", "src.workers*", "src.shared*"]
